services:
  atrust:
    image: ${ATRUST_IMAGE:-local/atrust:latest}
    container_name: atrust
    restart: unless-stopped
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
    sysctls:
      net.ipv4.conf.default.route_localnet: '1'
    environment:
      PASSWORD: ${VNC_PASSWORD:?Set VNC_PASSWORD in the private .env file}
      URLWIN: '1'
      CHROMIUM: ${CHROMIUM:-}
      USE_NOVNC: ${USE_NOVNC:-}
    volumes:
      - ./data:/root
    ports:
      - '127.0.0.1:5901:5901'
      - '127.0.0.1:1080:1080'
      - '127.0.0.1:8888:8888'
      - '127.0.0.1:54631:54631'
      - '127.0.0.1:8080:8080' # optional noVNC
