name: Ubuntu 24.04 runtime image (no proprietary DEB)
on:
  push:
    branches: [main, ubuntu-24.04]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate shell syntax
        run: |
          bash -n build.sh
          bash -n runtime/scripts/start.sh runtime/scripts/install-atrust.sh build-scripts/install-vpn-gui.sh
          bash -n tests/ubuntu-24.04-smoke.sh set-vnc-password.sh check.sh
      - name: Validate default Compose image and runtime secret path
        run: |
          grep -Fxq '/runtime/vnc-password' .gitignore
          grep -Fq 'VNC_PASSWORD_FILE: /opt/atrust/vnc-password' compose.yaml
          ! grep -Eq '^[[:space:]]+(PASSWORD|VNC_PASSWORD):' compose.yaml
          docker compose config --format json |
            python3 -c 'import json,sys; cfg=json.load(sys.stdin); assert cfg["services"]["atrust"]["image"] == "tingjusting/atrust:latest"; e=cfg["services"]["atrust"]["environment"]; assert e["VNC_PASSWORD_FILE"] == "/opt/atrust/vnc-password"; assert "PASSWORD" not in e and "VNC_PASSWORD" not in e'
      - name: Build minimal Ubuntu 24.04 runtime (no DEB)
        run: docker build --progress=plain --build-arg CHROMIUM=0 -t tingjusting/atrust:latest .
      - name: Verify runtime and show image size
        run: bash tests/ubuntu-24.04-smoke.sh
