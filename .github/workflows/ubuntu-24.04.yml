name: Ubuntu 24.04 runtime image (no proprietary DEB)
on:
  push:
    branches: [main, ubuntu-24.04]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate shell syntax
        run: |
          bash -n build.sh
          bash -n runtime/scripts/start.sh runtime/scripts/install-atrust.sh build-scripts/install-vpn-gui.sh
          bash -n tests/ubuntu-24.04-smoke.sh
      - name: Validate default Compose image
        run: |
          VNC_PASSWORD=ci docker compose config --format json |
            python3 -c 'import json,sys; cfg=json.load(sys.stdin); assert cfg["services"]["atrust"]["image"] == "tingjusting/atrust:latest"'
      - name: Verify runtime VNC secret configuration
        run: |
          bash -n set-vnc-password.sh
          test "$(grep -c '^/runtime/vnc-password
        run: docker build --progress=plain --build-arg CHROMIUM=0 -t tingjusting/atrust:latest .
      - name: Verify runtime and show image size
        run: bash tests/ubuntu-24.04-smoke.sh
 .gitignore)" -eq 1
          grep -q '^      VNC_PASSWORD_FILE: /opt/atrust/vnc-password
        run: docker build --progress=plain --build-arg CHROMIUM=0 -t tingjusting/atrust:latest .
      - name: Verify runtime and show image size
        run: bash tests/ubuntu-24.04-smoke.sh
 compose.yaml
          ! grep -Eq '^      (PASSWORD|VNC_PASSWORD):' compose.yaml
          VNC_PASSWORD=ci docker compose config --format json |
            python3 -c 'import json,sys; e=json.load(sys.stdin)["services"]["atrust"]["environment"]; assert e["VNC_PASSWORD_FILE"] == "/opt/atrust/vnc-password"; assert "PASSWORD" not in e and "VNC_PASSWORD" not in e'
      - name: Build minimal Ubuntu 24.04 runtime (no DEB)
        run: docker build --progress=plain --build-arg CHROMIUM=0 -t tingjusting/atrust:latest .
      - name: Verify runtime and show image size
        run: bash tests/ubuntu-24.04-smoke.sh
