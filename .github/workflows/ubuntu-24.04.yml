name: Ubuntu 24.04 runtime image (no proprietary DEB)
on:
  push:
    branches: [ubuntu-24.04]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate shell syntax
        run: |
          bash -n build.sh
          bash -n runtime/scripts/start.sh runtime/scripts/install-atrust.sh build-scripts/install-vpn-gui.sh
          bash -n tests/ubuntu-24.04-smoke.sh
      - name: Build minimal Ubuntu 24.04 runtime (no DEB)
        run: docker build --progress=plain --build-arg CHROMIUM=0 -t local/atrust:ubuntu-24.04 .
      - name: Verify runtime and show image size
        run: bash tests/ubuntu-24.04-smoke.sh local/atrust:ubuntu-24.04
